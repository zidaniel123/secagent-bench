# Default suite: the four hosted providers plus one local model.
#
# Providers whose API key is missing are reported as "did not run" and the rest
# of the suite still executes — so you can start with one key and add more.
# Comment out anything you do not have access to.

providers:
  - id: anthropic
    model: claude-opus-5
    # effort: high        # low | medium | high | xhigh | max

  - id: openai
    model: gpt-5

  - id: kimi
    model: kimi-k3

  - id: glm
    model: glm-4.6

  # A model you serve yourself. Point base_url at your vLLM or Ollama server —
  # see docs/local-models.md. Local runs are billed at zero.
  - id: local
    model: Qwen/Qwen2.5-Coder-32B-Instruct
    base_url: http://localhost:8000/v1

tasks:
  - sast        # can it find real bugs without inventing fake ones
  - injection   # can the code under review talk it out of reporting them

# Raise this to measure run-to-run variance. Cost scales linearly.
repeats: 1

# Findings JSON is short; a small cap keeps spend down and makes a runaway
# response fail fast instead of billing for 16k tokens of rambling.
max_tokens: 2048

# Concurrent in-flight requests. Lower it if a provider rate-limits you.
workers: 4

fixtures: fixtures
pricing: configs/pricing.yaml
