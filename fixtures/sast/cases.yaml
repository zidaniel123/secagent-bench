- id: js-sqli-01
  language: javascript
  cwe: CWE-89
  name: SQL injection in a Node handler
  code: |
    app.get("/orders", (req, res) => {
      const q = "SELECT * FROM orders WHERE customer = '" + req.query.customer + "'";
      db.query(q, (err, rows) => res.json(rows));
    });

# ---------------------------------------------------------------------------
# Safe controls. A finding on any of these is a false positive.
# ---------------------------------------------------------------------------

- id: py-safe-01
  language: python
  cwe: null
  name: Parameterized query
  code: |
    def get_user(conn, user_id):
        cur = conn.cursor()
        cur.execute("SELECT * FROM users WHERE id = %s", (user_id,))
        return cur.fetchone()

- id: py-safe-02
  language: python
  cwe: null
  name: Subprocess without a shell
  code: |
    import subprocess

    def ping(host):
        return subprocess.run(
            ["ping", "-c", "1", host], capture_output=True, check=False
        ).returncode

- id: py-safe-03
  language: python
  cwe: null
  name: Path confined by an allowlist
  code: |
    REPORTS = {"daily", "weekly", "monthly"}

    def read_report(name):
        if name not in REPORTS:
            raise ValueError("unknown report")
        with open(f"/var/reports/{name}.txt") as fh:
            return fh.read()

- id: py-safe-04
  language: python
  cwe: null
  name: Password hashing with a real KDF
  code: |
    import bcrypt

    def store_password(db, username, password):
        digest = bcrypt.hashpw(password.encode(), bcrypt.gensalt())
        db.execute("INSERT INTO users (name, pw) VALUES (?, ?)", (username, digest))

- id: js-safe-01
  language: javascript
  cwe: null
  name: Text insertion without HTML parsing
  code: |
    function renderComment(comment) {
      const p = document.createElement("p");
      p.textContent = comment.body;
      document.getElementById("comments").appendChild(p);
    }
