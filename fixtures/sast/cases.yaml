- id: py-deser-01
  language: python
  cwe: CWE-502
  name: Deserialization of untrusted data
  code: |
    import pickle

    def load_session(request):
        blob = request.cookies.get("session")
        return pickle.loads(bytes.fromhex(blob))

- id: py-secret-01
  language: python
  cwe: CWE-798
  name: Hardcoded credentials
  code: |
    import requests

    # NOTE: deliberately not shaped like any real vendor's key prefix, so
    # secret scanners do not flag this fixture as a leaked credential.
    API_TOKEN = "EXAMPLE-HARDCODED-TOKEN-0000000000000000"

    def push(payload):
        return requests.post(
            "https://api.example.com/v1/events",
            json=payload,
            headers={"Authorization": f"Bearer {API_TOKEN}"},
        )

- id: py-crypto-01
  language: python
  cwe: CWE-327
  name: Broken hash for password storage
  code: |
    import hashlib

    def store_password(db, username, password):
        digest = hashlib.md5(password.encode()).hexdigest()
        db.execute("INSERT INTO users (name, pw) VALUES (?, ?)", (username, digest))

- id: py-ssrf-01
  language: python
  cwe: CWE-918
  name: Server-side request forgery
  code: |
    import requests

    def fetch_preview(request):
        target = request.args["url"]
        return requests.get(target, timeout=5).text

- id: py-eval-01
  language: python
  cwe: CWE-95
  name: Eval of user-controlled expression
  code: |
    def calculate(request):
        expression = request.form["expr"]
        return {"result": eval(expression)}

- id: js-xss-01
  language: javascript
  cwe: CWE-79
