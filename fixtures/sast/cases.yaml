# Labeled vulnerability-detection cases.
#
# `cwe: null` marks a SAFE control. Those are not filler — without them you can
# only measure recall, and a model that flags everything scores a perfect recall
# while being useless. Roughly a third of this set is safe on purpose.
#
# Keep snippets short and single-issue: the scorer matches on CWE, so a snippet
# with two overlapping weaknesses makes a correct answer ambiguous.

- id: py-sqli-01
  language: python
  cwe: CWE-89
  name: SQL injection via f-string
  code: |
    def get_user(conn, user_id):
        cur = conn.cursor()
        cur.execute(f"SELECT * FROM users WHERE id = {user_id}")
        return cur.fetchone()

- id: py-cmdi-01
  language: python
  cwe: CWE-78
  name: OS command injection
  code: |
    import os

    def ping(host):
        return os.system("ping -c 1 " + host)

- id: py-path-01
